<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Приговор</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --gold:#d9b06a; --gold2:#f0d49a; --fg:#ece6dd; --muted:#a39a92; --panel:rgba(16,14,18,.86); --line:rgba(217,176,106,.35); }
  [hidden] { display:none !important; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:#0c0b0e; color:var(--fg); font:16px Inter,system-ui,sans-serif; overflow:hidden; user-select:none; }
  #bg { position:fixed; inset:-4%; background:#0c0b0e url(bg_menu.jpg) center/cover no-repeat; animation:drift 40s ease-in-out infinite alternate; filter:saturate(.95); }
  @keyframes drift { from { transform:scale(1.04) translate(-1%, 0); } to { transform:scale(1.1) translate(1.5%, -1%); } }
  #shade { position:fixed; inset:0; background:linear-gradient(90deg, rgba(8,7,10,.92) 0%, rgba(8,7,10,.72) 34%, rgba(8,7,10,.15) 70%, rgba(8,7,10,0) 100%), linear-gradient(0deg, rgba(8,7,10,.6), transparent 40%); }
  canvas#dust { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; }
  main { position:fixed; left:max(6vw, env(safe-area-inset-left)); top:50%; transform:translateY(-50%); width:min(440px, 88vw); }
  h1 { font:700 clamp(54px, 9vw, 96px)/1 'Cormorant Garamond', Georgia, serif; margin:0; letter-spacing:.01em;
       background:linear-gradient(180deg, var(--gold2), var(--gold) 55%, #a7793a); -webkit-background-clip:text; background-clip:text; color:transparent;
       filter:drop-shadow(0 4px 18px rgba(0,0,0,.6)); }
  .sub { color:var(--muted); margin:.6em 0 2.2em; font-size:15px; letter-spacing:.02em; }
  .btn { display:block; width:100%; margin:0 0 12px; padding:15px 20px; font:500 18px Inter,system-ui,sans-serif; color:var(--fg); text-align:left;
         background:rgba(20,18,22,.72); border:1px solid var(--line); border-radius:10px; cursor:pointer; transition:background .2s, border-color .2s, transform .1s; }
  .btn:hover,.btn:focus-visible { background:rgba(60,46,26,.85); border-color:var(--gold); outline:none; }
  .btn:active { transform:scale(.985); }
  .btn.primary { background:linear-gradient(90deg, rgba(120,88,40,.9), rgba(70,52,26,.85)); border-color:var(--gold); }
  .btn small { display:block; color:var(--muted); font-size:13px; font-weight:400; margin-top:3px; }
  .foot { position:fixed; left:max(6vw, env(safe-area-inset-left)); bottom:max(18px, env(safe-area-inset-bottom)); color:#6f6862; font-size:12px; }
  /* settings */
  #set { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.55); backdrop-filter:blur(4px); }
  #set.on { display:flex; }
  .panel { width:min(560px, 94vw); max-height:92vh; overflow:auto; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:22px 24px; box-shadow:0 20px 60px rgba(0,0,0,.6); }
  .panel h2 { font:700 32px 'Cormorant Garamond', Georgia, serif; color:var(--gold); margin:0 0 14px; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:14px; padding:11px 0; border-bottom:1px solid rgba(255,255,255,.06); }
  .row label { flex:1; }
  .row small { display:block; color:var(--muted); font-size:12.5px; margin-top:2px; }
  .seg { display:flex; flex-wrap:wrap; gap:6px; justify-content:flex-end; }
  .seg button { padding:8px 11px; font:500 14px Inter,sans-serif; color:var(--fg); background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.12); border-radius:8px; cursor:pointer; }
  .seg button.on { background:rgba(150,110,50,.55); border-color:var(--gold); color:#fff; }
  input[type=range] { width:170px; accent-color:var(--gold); }
  .sw { width:50px; height:28px; border-radius:14px; background:rgba(255,255,255,.14); position:relative; border:0; cursor:pointer; flex:none; }
  .sw::after { content:''; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:#ddd; transition:left .18s; }
  .sw.on { background:#a57b3c; } .sw.on::after { left:25px; background:#fff; }
  .actions { display:flex; gap:10px; margin-top:18px; }
  .actions .btn { text-align:center; margin:0; }
  #fade { position:fixed; inset:0; background:#000; opacity:0; pointer-events:none; transition:opacity .6s; }
</style>
</head>
<body>
<div id="bg"></div><div id="shade"></div><canvas id="dust"></canvas>
<main>
  <h1>Приговор</h1>
  <div class="sub">Детектив. Палата Милосердия. Поезд, 2008 год.</div>
  <button class="btn primary" id="play">Начать игру<small>Пролог в Палате, затем ночь в поезде</small></button>
  <button class="btn" id="openSet">Настройки графики<small id="setHint"></small></button>
  <button class="btn" id="quit" hidden>Выход</button>
</main>
<div class="foot">Лучше играть со звуком и в горизонтальном положении</div>

<div id="set" role="dialog" aria-modal="true" aria-labelledby="setTitle">
  <div class="panel">
    <h2 id="setTitle">Настройки графики</h2>
    <div class="row"><label>Качество<small>Готовый набор настроек</small></label><div class="seg" id="q"></div></div>
    <div class="row"><label>Чёткость <span id="scaleV"></span><small>Меньше — плавнее на слабом телефоне</small></label><input type="range" id="scale" min="0.5" max="1.35" step="0.05"></div>
    <div class="row"><label>Сглаживание<small>Убирает «лесенку» на краях</small></label><button class="sw" id="aa" aria-label="Сглаживание"></button></div>
    <div class="row"><label>Свечение<small>Мягкий ореол света в прологе</small></label><button class="sw" id="bloom" aria-label="Свечение"></button></div>
    <div class="row"><label>Пыль в воздухе<small>Пылинки в лучах света</small></label><button class="sw" id="dustSw" aria-label="Пыль в воздухе"></button></div>
    <div class="row"><label>Частота кадров<small>30 экономит батарею</small></label><div class="seg" id="fps"></div></div>
    <div class="actions"><button class="btn primary" id="done">Готово</button></div>
  </div>
</div>
<div id="fade"></div>

<script src="gfx.js"></script>
<script>
const $ = s => document.querySelector(s);
const G = window.GFX, P = G.PRESETS;
const QN = { low:'Низкая', medium:'Средняя', high:'Высокая', ultra:'Ультра', custom:'Своя' };
function save() {
  G.q = detect();
  const o = { q:G.q, scale:G.scale, aa:G.aa, bloom:G.bloom, dust:G.dust, fps:G.fps, people:G.people };
  try { localStorage.setItem('prigovor_gfx', JSON.stringify(o)); } catch (e) {}
}
function detect() {
  for (const k in P) { const p = P[k]; if (p.scale === G.scale && p.aa === G.aa && p.bloom === G.bloom && p.dust === G.dust && p.fps === G.fps) return k; }
  return 'custom';
}
function seg(el, items, cur, on) {
  el.innerHTML = '';
  for (const [v, label] of items) {
    const b = document.createElement('button'); b.textContent = label; b.className = v === cur ? 'on' : '';
    b.onclick = () => on(v); el.appendChild(b);
  }
}
function render() {
  G.q = detect();
  seg($('#q'), Object.keys(QN).filter(k => k !== 'custom' || G.q === 'custom').map(k => [k, QN[k]]), G.q, k => { if (P[k]) Object.assign(G, P[k]); save(); render(); });
  seg($('#fps'), [[30,'30'],[60,'60'],[0,'Без предела']], G.fps, v => { G.fps = v; save(); render(); });
  $('#scale').value = G.scale; $('#scaleV').textContent = Math.round(G.scale * 100) + '%';
  for (const [id, k] of [['#aa','aa'],['#bloom','bloom'],['#dustSw','dust']]) { $(id).classList.toggle('on', !!G[k]); $(id).setAttribute('aria-pressed', !!G[k]); }
  $('#setHint').textContent = 'Сейчас: ' + QN[G.q];
}
$('#scale').oninput = e => { G.scale = +e.target.value; save(); render(); };
for (const [id, k] of [['#aa','aa'],['#bloom','bloom'],['#dustSw','dust']]) $(id).onclick = () => { G[k] = !G[k]; save(); render(); };
$('#openSet').onclick = () => { $('#set').classList.add('on'); $('#done').focus(); };
$('#done').onclick = () => $('#set').classList.remove('on');
$('#set').onclick = e => { if (e.target.id === 'set') $('#set').classList.remove('on'); };
$('#play').onclick = () => { $('#fade').style.opacity = 1; setTimeout(() => location.href = 'index.html', 600); };
if (window.Android && Android.quit) { $('#quit').hidden = false; $('#quit').onclick = () => Android.quit(); }
// первый запуск: на телефоне — средняя графика
try { if (!localStorage.getItem('prigovor_gfx')) { const phone = /Android|iPhone|iPad/i.test(navigator.userAgent); Object.assign(G, P[phone ? 'medium' : 'high']); save(); } } catch (e) {}
render();

// пылинки в луче света
const cv = $('#dust'), cx = cv.getContext('2d'); let W, H, motes = [];
function rs() { W = cv.width = innerWidth * Math.min(devicePixelRatio, 2); H = cv.height = innerHeight * Math.min(devicePixelRatio, 2);
  motes = Array.from({ length: G.dust ? 70 : 0 }, () => ({ x: Math.random() * W, y: Math.random() * H, r: (Math.random() * 1.6 + .4) * devicePixelRatio, v: Math.random() * .15 + .05, a: Math.random() * Math.PI * 2 })); }
addEventListener('resize', rs); rs();
(function tick(t) { cx.clearRect(0, 0, W, H);
  for (const m of motes) { m.y -= m.v; m.x += Math.sin(t / 3000 + m.a) * .2; if (m.y < -5) { m.y = H + 5; m.x = Math.random() * W; }
    const al = .25 + .25 * Math.sin(t / 900 + m.a); cx.fillStyle = 'rgba(255,236,200,' + al + ')'; cx.beginPath(); cx.arc(m.x, m.y, m.r, 0, 7); cx.fill(); }
  requestAnimationFrame(tick); })(0);
</script>
</body>
</html>
