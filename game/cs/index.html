<title>Катсцена «Приговор»</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=PT+Sans:wght@400;700&display=swap">
<style>
/* текст пролога не выделяется и не копируется долгим нажатием */
html,body,*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input,textarea{-webkit-user-select:text;user-select:text}

/* layout: full-screen 3D canvas; overlays stacked on top: fade, subtitles, choice labels, top controls, start and end screens */
:root{--bg:#07060a;--fg:#efe9e1;--muted:#a89f97;--gold:#d4ad55;--blood:#b8321f;--display:"Cinzel",Georgia,serif;--body:"PT Sans",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
/* «Смотреть» нажали раньше, чем догрузились герои: тихий индикатор внизу тёмного экрана */
#wait{position:absolute;left:50%;bottom:14%;transform:translateX(-50%);width:min(320px,70vw);text-align:center;color:#cbb88f;font:13px/1.4 "PT Sans",sans-serif;letter-spacing:.04em;pointer-events:none;z-index:5}
#wait p{margin:0 0 8px;opacity:.85}#wait .wbar{height:2px;background:#ffffff1a;border-radius:2px;overflow:hidden}#wait i{display:block;height:100%;width:0;background:#d9b06a;transition:width .3s}
#subs{position:absolute;left:50%;bottom:max(6%,env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(86%,900px);text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}
#subs .who{display:inline-block;margin-bottom:.35em;background:rgba(5,4,8,.62);padding:.15em .5em;border-radius:3px;font-family:var(--display);font-size:clamp(.7rem,1.6vw,.9rem);letter-spacing:.12em;color:var(--gold);text-transform:uppercase;margin-bottom:.2em;text-shadow:0 1px 4px #000}
#subs .line{display:inline;font-size:clamp(1rem,2.6vw,1.45rem);line-height:1.45;background:rgba(5,4,8,.62);padding:.12em .45em;border-radius:4px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
#train{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .6s;background:repeating-linear-gradient(90deg,transparent 0 16%,rgba(255,206,140,.22) 16% 21%,transparent 21% 38%);background-size:200% 100%;-webkit-mask-image:linear-gradient(transparent 28%,#000 40%,#000 60%,transparent 72%);mask-image:linear-gradient(transparent 28%,#000 40%,#000 60%,transparent 72%);animation:pass .9s linear infinite}
@keyframes pass{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){#train{animation:none}}
#card{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0;text-align:center;padding:0 8%}
#card .big{font-family:var(--display);font-size:clamp(1.2rem,3.6vw,2.2rem);letter-spacing:.08em;text-wrap:balance}
#card .small{margin-top:.5em;color:var(--muted);font-size:clamp(.85rem,2vw,1.05rem)}
#card.dossier{place-items:end center;padding-bottom:12%}#card.dossier .big{color:#fff3d6;text-shadow:0 0 18px rgba(255,190,90,.8),0 2px 6px #000}
#card.dossier .small{color:#f3d9a2;text-shadow:0 1px 5px #000}
#ask{position:absolute;top:12%;left:0;right:0;text-align:center;font-family:var(--display);font-size:clamp(1.05rem,3vw,1.8rem);letter-spacing:.06em;text-shadow:0 2px 10px #000;pointer-events:none;opacity:0;transition:opacity .4s}
#labels{position:absolute;inset:0;pointer-events:none}
#labels button{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;font:inherit;font-weight:700;font-size:clamp(.8rem,2vw,1rem);color:#fff;background:rgba(10,8,14,.72);border:1px solid var(--gold);border-radius:999px;padding:.55em 1em;min-height:44px;cursor:pointer;white-space:nowrap}
#labels button:hover,#labels button:focus-visible{background:#3a2c12;outline:none}
#labels button .ok{color:var(--gold);margin-left:.35em}
#top{position:absolute;top:max(10px,env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));display:flex;gap:8px}
#top button,.menu button{font:inherit;font-size:.85rem;color:var(--fg);background:rgba(10,8,14,.6);border:1px solid rgba(255,255,255,.22);border-radius:6px;padding:.5em .9em;min-height:40px;cursor:pointer}
#top button:hover,.menu button:hover{border-color:var(--gold)}
#skip[hidden]{display:none}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;background:radial-gradient(ellipse at 50% 40%,#1c1712 0%,#07060a 70%)}
.screen h1{font-family:var(--display);font-size:clamp(2rem,7vw,4rem);margin:0;letter-spacing:.1em;color:#f6efe3}
.screen h1 span{color:var(--gold)}
.screen p{margin:0;color:var(--muted);max-width:34em;line-height:1.5}
.bar{width:min(360px,80%);height:6px;background:#221d1a;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8e6a24,#e3c071)}
.menu{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.menu button.main{font-size:1.05rem;padding:.7em 1.6em;border-color:var(--gold);background:#2a2113}
.menu button:disabled{opacity:.45;cursor:default}
#end{background:rgba(5,4,8,.78)}
.screen[hidden],[hidden]{display:none!important}
#rot{position:absolute;left:50%;top:max(12px,env(safe-area-inset-top,0px));transform:translateX(-50%);background:rgba(10,8,14,.75);border:1px solid rgba(255,255,255,.2);border-radius:6px;padding:.4em .8em;font-size:.8rem;color:var(--muted);pointer-events:none}
@media (orientation:landscape){#rot{display:none}}
#dbg{position:absolute;left:8px;top:8px;max-width:46%;max-height:92%;overflow:auto;background:rgba(0,0,0,.8);font:11px/1.35 monospace;padding:6px;border:1px solid #444;z-index:9}
#dbg button{font:15px monospace;padding:5px 8px;margin:2px}#dbg{font-size:14px}
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
  <div id="fade"></div>
  <div id="wait" hidden><p id="waitTxt"></p><div class="wbar"><i id="waitBar"></i></div></div>
  <div id="labels"></div>
  <div id="ask"></div>
  <div id="train"></div>
  <div id="card"><div><div class="big"></div><div class="small"></div></div></div>
  <div id="subs"><span class="who"></span><span class="line"></span></div>
  <div id="top">
    <button id="lang" type="button">EN</button>
    <button id="snd" type="button">Звук: вкл</button>
    <button id="skip" type="button" hidden>Пропустить ›</button>
  </div>
  <div id="rot">Поверните телефон горизонтально</div>

    <h1>При<span>говор</span></h1>
    <p id="startTxt">Пролог. Палата Милосердия зачитывает приговор четверым. Смотреть со звуком.</p>
    <div class="bar" style="display:none"><i id="prog"></i></div>
    <p id="progTxt" style="display:none">Загружаю героев…</p>
    <div class="menu"><button class="main" id="go" type="button" disabled>Смотреть</button></div>
  </div>
  <div class="screen" id="end" hidden>
    <h1>Первое <span>из ста</span></h1>
    <p id="endTxt">Дальше — купе 3–4 вагона Б, поезд 2008 года.</p>
    <div class="menu">
      <button class="main" id="play" type="button">Играть</button>
      <button id="again" type="button">Послушать другой приговор</button>
      <button id="restart" type="button">С начала</button>
    </div>
  </div>
</div>

   WAIT_P=.55;prog();let i=0;for(const x of tx){try{r.initTexture(x);}catch(e){}if(++i%4===0){WAIT_P=.55+.43*i/tx.size;prog();await new Promise(q=>setTimeout(q,0));}}
   flip.forEach(o=>{o.visible=false;});}
  composer.render(); // прогрев за тёмным экраном: шейдеры свечения и буферы кадра собираются здесь, а не в первом кадре пролога
  loadedOK=true;$('#progTxt').textContent=T(...UI.ready);$('#prog').style.width='100%';
  if(DEBUG){buildDbg();dbgHash();}
  return true;
 }catch(e){console.error(e);$('#progTxt').style.display='block';$('#progTxt').textContent=T('Не удалось загрузить: ','Failed to load: ')+e.message;loading=null;$('#go').disabled=false;return false;}})();return loading;}
$('#go').onclick=async()=>{audioInit();smpcInit();if(SND.ctx&&SND.ctx.state!=='running')SND.ctx.resume();$('#go').disabled=true;
 // «Смотреть» работает сразу: если модели ещё догружаются, пролог начинается с темноты и тиканья часов
 if(!loadedOK){$('#start').hidden=true;fade('#000',1);level('tick',.6);level('sand',.12);$('#wait').hidden=false;prog();}
 const ok=await loadAll();$('#go').disabled=false;$('#wait').hidden=true;if(!ok){$('#start').hidden=false;return;}$('#start').hidden=true;started=true;go(1);};
$('#play').onclick=()=>{if(EMBED&&parent!==window){parent.postMessage({cutscene:'done',hero:S.hero},'*');return;}window.open('https://claude.ai/artifact/GHanCzXV5hD9EDjAWH4Mc1','_blank','noopener');};
boot();
