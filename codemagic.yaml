# То же, что .github/workflows/ios.yml, но для Codemagic (работает и с репозиторием на GitLab).
# Результат — неподписанный Prigovor.ipa в артефактах сборки.
workflows:
  ios-unsigned:
    name: iOS (unsigned IPA)
    instance_type: mac_mini_m2
    max_build_duration: 30
    scripts:
      - name: XcodeGen
        script: brew install xcodegen && xcodegen generate
      - name: Build
        script: |
          xcodebuild -project Prigovor.xcodeproj -scheme Prigovor -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        script: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Prigovor.app Payload/
          zip -qry Prigovor.ipa Payload
    artifacts:
      - Prigovor.ipa
